<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solane Concierge — MARGOT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; background: #0A090C; font-family: 'Instrument Sans', sans-serif; }

  [data-theme="dark"] {
    --room: #0A090C; --bg: #141117; --surface: #1C1821; --surface2: #241F2B;
    --line: #302A38; --ink: #F6F0F4; --muted: #9A8FA4;
    --neon: #F0574F; --mint: #3DD6C0; --warnbg: #2B1518;
    --glow: 0 0 26px rgba(240,87,79,.45); --mintglow: 0 0 22px rgba(61,214,192,.35);
    --shadow: 0 30px 70px rgba(0,0,0,.6); --tagbg: rgba(10,9,12,.7); --stockbg: rgba(20,17,23,.72);
  }
  [data-theme="light"] {
    --room: #DCD6D2; --bg: #F1EDEA; --surface: #FFFFFF; --surface2: #F6F1ED;
    --line: #DFD7D2; --ink: #191418; --muted: #6C6270;
    --neon: #D8402F; --mint: #10897A; --warnbg: #FAE7E3;
    --glow: 0 0 0 rgba(0,0,0,0); --mintglow: 0 0 0 rgba(0,0,0,0);
    --shadow: 0 26px 60px rgba(60,40,40,.22); --tagbg: rgba(60,40,40,.55); --stockbg: rgba(255,255,255,.8);
  }
  [data-device="phone"]  { --frame-w: 390px; --frame-h: 780px; --measure: 100%; }
  [data-device="tablet"] { --frame-w: 834px; --frame-h: 900px; --measure: 580px; }

  @keyframes riseIn  { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes addPulse { 0% { transform: scale(1); } 45% { transform: scale(1.07); } 100% { transform: scale(1); } }
  @keyframes tubeOn  { 0% { opacity: .15; } 12% { opacity: 1; } 20% { opacity: .3; } 32% { opacity: 1; } 44% { opacity: .5; } 100% { opacity: 1; } }
  @keyframes buzz    { 0%,100% { opacity: 1; } 47% { opacity: .82; } 49% { opacity: .35; } 51% { opacity: 1; } }
  @keyframes dotFade { 0%,100% { opacity: .3; } 50% { opacity: 1; } }

  #app { min-height: 100vh; background: var(--room); color: var(--ink);
         display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 26px 16px 56px; }

  .bebas { font-family: 'Bebas Neue', sans-serif; }
  .kicker { font-size: 9.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); }
  .rise { animation: riseIn .5s ease both; }

  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; width: 100%; max-width: var(--frame-w); }
  .brand { font-family: 'Bebas Neue', sans-serif; font-size: 30px; letter-spacing: .09em; line-height: 1;
           color: var(--neon); text-shadow: var(--glow); animation: buzz 7s ease-in-out infinite; }
  .brand-sub { font-size: 10.5px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
  .pillbtn { font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
             color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px;
             padding: 8px 13px; cursor: pointer; }
  .pillbtn:hover { color: var(--ink); border-color: var(--neon); }
  .pillbtn.neon { color: var(--neon); border-color: var(--neon); box-shadow: var(--glow); }

  .frame { width: var(--frame-w); height: var(--frame-h); background: var(--bg); border: 1px solid var(--line);
           border-radius: 34px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .frame-col { height: 100%; display: flex; flex-direction: column; }
  .scroll { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; padding: 24px 0 40px; }
  .measure { width: 100%; max-width: var(--measure); margin: 0 auto; }

  .statusbar { display: flex; align-items: center; justify-content: space-between; padding: 17px 22px 14px;
               border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); box-shadow: var(--mintglow); animation: dotFade 2.4s ease-in-out infinite; }
  .status-label { font-size: 10px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .order-badge { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: .1em; color: var(--neon); }

  .hero { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1.05; letter-spacing: .02em; text-wrap: pretty; margin-bottom: 10px; }
  .sub { font-size: 14.5px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }
  .concierge-line { font-size: 15px; line-height: 1.65; text-wrap: pretty; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .chip { font-family: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
          border-radius: 999px; padding: 10px 16px; cursor: pointer; transition: all .22s ease; }
  .chip:hover { border-color: var(--neon); color: var(--neon); }
  .chip.on { background: var(--neon); color: var(--bg); border-color: var(--neon); box-shadow: var(--glow); }
  .chip.on:hover { color: var(--bg); }

  .bubble { max-width: 78%; background: var(--surface2); border: 1px solid var(--line);
            border-radius: 18px 18px 6px 18px; padding: 11px 15px; font-size: 14px; line-height: 1.5; }

  .dish { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; animation: riseIn .5s ease both; }
  .dish-img-wrap { position: relative; height: 210px; }
  .dish-img { width: 100%; height: 100%; background-color: var(--surface2); background-size: cover; background-position: center; }
  .dish-fade { position: absolute; inset: auto 0 0 0; height: 60%; background: linear-gradient(to top, var(--surface), transparent); }
  .stockbadge { position: absolute; top: 12px; right: 12px; font-size: 9px; font-weight: 600; letter-spacing: .16em;
                text-transform: uppercase; color: var(--neon); border: 1px solid var(--neon); border-radius: 999px;
                padding: 5px 10px; background: var(--stockbg); box-shadow: var(--glow); }
  .dish-body { padding: 4px 18px 18px; margin-top: -34px; position: relative; }
  .dish-toprow { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .dish-name { font-family: 'Bebas Neue', sans-serif; font-size: 27px; line-height: 1.05; letter-spacing: .02em; }
  .dish-price { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: .04em; color: var(--neon); text-shadow: var(--glow); }
  .dish-note { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin-top: 7px; text-wrap: pretty; }
  .dish-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 15px; }
  .dish-meta { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .addbtn { font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
            padding: 11px 16px; border-radius: 999px; transition: all .25s ease;
            background: var(--ink); color: var(--bg); border: 1px solid var(--ink); cursor: pointer; }
  .addbtn.added { background: transparent; color: var(--mint); border: 1px solid var(--mint); box-shadow: var(--mintglow); }
  .addbtn.gone { background: transparent; color: var(--muted); border: 1px dashed var(--line); cursor: not-allowed; }
  .addbtn.flash { animation: addPulse .6s ease; }

  .gal-wrap { margin-top: 16px; overflow: hidden; cursor: grab; touch-action: pan-y; }
  .gal-wrap:active { cursor: grabbing; }
  .gal-track { display: flex; gap: 12px; padding: 0 22px; will-change: transform; }
  .gal-item { flex: 0 0 auto; width: 256px; }
  .gal-imgbox { height: 320px; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); position: relative; }
  .gal-img { width: 100%; height: 100%; background-color: var(--surface2); background-size: cover; background-position: center; pointer-events: none; }
  .gal-tag { position: absolute; top: 12px; left: 12px; font-size: 9px; font-weight: 600; letter-spacing: .18em;
             text-transform: uppercase; background: var(--tagbg); border-radius: 999px; padding: 5px 10px; }
  .gal-cap { font-size: 12.5px; color: var(--muted); margin-top: 9px; }
  .dots { display: flex; gap: 6px; padding: 14px 22px 0; }
  .dot { width: 8px; height: 3px; border-radius: 999px; border: none; padding: 0; cursor: pointer;
         transition: all .3s ease; background: var(--line); }
  .dot.on { width: 24px; background: var(--neon); box-shadow: var(--glow); }

  .cta { font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
         background: var(--neon); color: var(--bg); border: none; border-radius: 999px; padding: 12px 20px;
         cursor: pointer; box-shadow: var(--glow); }

  .draft { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
  .draft-lines { padding: 18px 18px 6px; }
  .oline { display: flex; align-items: center; gap: 13px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .oline-img { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; flex: 0 0 auto;
               background-color: var(--surface2); background-size: cover; background-position: center; }
  .oline-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: .03em; line-height: 1.1; }
  .oline-meta { font-size: 10px; font-weight: 600; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }
  .oline-price { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: .04em; }
  .totals { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0 15px; }
  .totals-cal { font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .totals-price { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .05em; color: var(--neon); text-shadow: var(--glow); }

  .warn { background: var(--warnbg); border-top: 1px solid var(--neon); padding: 15px 18px; }
  .warn-head { display: flex; align-items: center; gap: 9px; }
  .warn-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--neon); box-shadow: var(--glow); animation: dotFade 1.8s ease-in-out infinite; }
  .warn-kind { font-size: 9.5px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--neon); }
  .warn-text { font-size: 13.5px; line-height: 1.55; color: var(--ink); margin-top: 8px; text-wrap: pretty; }
  .warn-act { margin-top: 11px; font-family: inherit; font-size: 12.5px; color: var(--ink); background: transparent;
              border: 1px solid var(--neon); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: all .2s ease; }
  .warn-act:hover { background: var(--neon); color: var(--bg); }

  .draft-actions { display: flex; gap: 10px; padding: 16px 18px 18px; }
  .approve { flex: 1 1 auto; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .18em;
             text-transform: uppercase; background: var(--neon); color: var(--bg); border: none; border-radius: 999px;
             padding: 15px 18px; cursor: pointer; box-shadow: var(--glow); }
  .changebtn { flex: 0 0 auto; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .18em;
               text-transform: uppercase; background: transparent; color: var(--muted); border: 1px solid var(--line);
               border-radius: 999px; padding: 15px 18px; cursor: pointer; }
  .changebtn:hover { color: var(--ink); border-color: var(--neon); }

  .swaps { background: var(--surface2); border: 1px solid var(--line); border-radius: 20px; padding: 17px 18px; }
  .swaps-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .swaps-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .03em; }
  .swaps-cal { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: .04em; color: var(--mint); text-shadow: var(--mintglow); }
  .swap-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%;
              background: transparent; border: none; border-bottom: 1px solid var(--line); padding: 13px 0;
              cursor: pointer; text-align: left; font-family: inherit; }
  .swap-label { font-size: 13.5px; color: var(--ink); }
  .swap-detail { font-size: 9.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .knob { flex: 0 0 auto; width: 42px; height: 23px; border-radius: 999px; transition: all .25s ease; background-color: var(--line);
          background-image: radial-gradient(circle 8.5px at 13px 11.5px, var(--surface) 99%, transparent 100%); }
  .knob.on { background-color: var(--mint); box-shadow: var(--mintglow);
             background-image: radial-gradient(circle 8.5px at 29px 11.5px, var(--surface) 99%, transparent 100%); }

  .tracker { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px 18px 18px; }
  .tracker-head { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: .04em; line-height: 1.05;
                  color: var(--neon); text-shadow: var(--glow); animation: buzz 5s ease-in-out infinite; }
  .stage-row { display: flex; align-items: center; gap: 13px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .stage-mark { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; transition: all .5s ease; background: var(--line); }
  .stage-mark.done { background: var(--mint); box-shadow: var(--mintglow); }
  .stage-mark.now { width: 10px; height: 10px; background: var(--neon); box-shadow: var(--glow); }
  .stage-label { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: .06em; text-transform: uppercase;
                 transition: color .5s ease; color: var(--muted); }
  .stage-label.done { color: var(--ink); }
  .stage-label.now { color: var(--neon); text-shadow: var(--glow); animation: tubeOn .9s ease both; }
  .stage-rule { flex: 1 1 auto; height: 1px; background: var(--line); }
  .stage-time { font-size: 10px; font-weight: 600; letter-spacing: .12em; color: var(--muted); }
  .tracker-note { margin-top: 15px; font-size: 13.5px; line-height: 1.6; color: var(--muted); text-wrap: pretty; }

  .res-card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; }
  .res-dates { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .res-date { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 0 0 auto; min-width: 60px;
              padding: 10px 6px; border-radius: 14px; cursor: pointer; transition: all .22s ease;
              background: transparent; border: 1px solid var(--line); font-family: inherit; color: var(--ink); }
  .res-date.on { background: var(--surface2); border-color: var(--neon); }
  .res-dow { font-size: 9px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .res-day { font-family: 'Bebas Neue', sans-serif; font-size: 23px; letter-spacing: .04em; }
  .res-times { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .res-time { font-family: inherit; font-size: 12.5px; font-weight: 500; padding: 10px 14px; border-radius: 999px;
              transition: all .22s ease; background: transparent; color: var(--ink); border: 1px solid var(--line); cursor: pointer; }
  .res-time.on { background: var(--neon); color: var(--bg); border-color: var(--neon); box-shadow: var(--glow); }
  .res-time.closed { color: var(--muted); border: 1px dashed var(--line); text-decoration: line-through; cursor: not-allowed; }
  .party-row { display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .party-btn { font-size: 15px; color: var(--ink); background: transparent; border: 1px solid var(--line);
               border-radius: 50%; width: 32px; height: 32px; cursor: pointer; }
  .party-n { font-family: 'Bebas Neue', sans-serif; font-size: 24px; min-width: 20px; text-align: center; }
  .bookbtn { width: 100%; margin-top: 16px; font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: .18em;
             text-transform: uppercase; border-radius: 999px; padding: 15px 18px; cursor: pointer; transition: all .25s ease;
             background: var(--ink); color: var(--bg); border: 1px solid var(--ink); }
  .bookbtn.held { background: transparent; color: var(--mint); border: 1px solid var(--mint); box-shadow: var(--mintglow); }

  .restart-row { padding: 34px 22px 0; display: flex; align-items: center; gap: 10px; }
  .restart-rule { height: 1px; flex: 1 1 auto; background: var(--line); }
  .restart { font-family: inherit; font-size: 9px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
             color: var(--muted); background: transparent; border: none; cursor: pointer; }

  .composer { flex: 0 0 auto; border-top: 1px solid var(--line); padding: 13px 16px 16px; display: flex;
              align-items: center; gap: 10px; width: 100%; max-width: var(--measure); margin: 0 auto; }
  .composer-input { flex: 1 1 auto; border: 1px solid var(--line); border-radius: 999px; padding: 13px 17px;
                    font-size: 13.5px; color: var(--muted); background: var(--surface); }
  .composer-send { width: 44px; height: 44px; border-radius: 50%; background: var(--neon); box-shadow: var(--glow);
                   display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--bg); }

  /* Kitchen view */
  .k-head { flex: 0 0 auto; padding: 17px 20px 14px; border-bottom: 1px solid var(--line); }
  .k-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
  .k-title { font-family: 'Bebas Neue', sans-serif; font-size: 21px; letter-spacing: .09em; color: var(--neon); text-shadow: var(--glow); }
  .k-open { font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: .06em; }
  .k-stats { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
  .k-stat { font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .k-86bar { display: flex; align-items: center; gap: 9px; margin-top: 11px; background: var(--warnbg);
             border: 1px solid var(--neon); border-radius: 12px; padding: 9px 12px; }
  .k-86tag { font-size: 9px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--neon); }
  .k-86list { font-size: 12.5px; color: var(--ink); }
  .k-scroll { flex: 1 1 auto; overflow-y: auto; padding: 16px 20px 28px; }
  .k-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 14px; align-items: start; }
  .ticket { display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; overflow: hidden; border: 1px solid var(--line); }
  .ticket.live { border-color: var(--neon); box-shadow: var(--glow); }
  .ticket.closed { opacity: .55; }
  .t-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px 11px; border-bottom: 1px solid var(--line); }
  .t-seat { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .05em; line-height: 1; }
  .ticket.closed .t-seat { color: var(--muted); }
  .t-live { font-size: 8.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--neon); }
  .t-time { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
  .t-chip { font-size: 9px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; }
  .t-rows { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; }
  .t-row { display: flex; gap: 9px; align-items: baseline; }
  .t-qty { font-family: 'Bebas Neue', sans-serif; font-size: 17px; letter-spacing: .04em; color: var(--neon); min-width: 20px; }
  .t-name { font-size: 13.5px; line-height: 1.35; }
  .t-mod { font-size: 11px; font-style: italic; color: var(--muted); }
  .t-allergy { display: flex; align-items: center; gap: 8px; background: var(--warnbg); border-top: 1px solid var(--neon); padding: 10px 14px; }
  .t-allergy-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--neon); box-shadow: var(--glow); animation: dotFade 1.6s ease-in-out infinite; }
  .t-allergy-label { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--neon); }
  .t-note { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; line-height: 1.5; color: var(--muted); }
  .t-actions { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid var(--line); }
  .bumpbtn { flex: 1 1 auto; font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .16em;
             text-transform: uppercase; border-radius: 999px; padding: 11px 12px; transition: all .2s ease;
             background: var(--ink); color: var(--bg); border: none; cursor: pointer; }
  .bumpbtn.closed { background: transparent; color: var(--muted); border: 1px dashed var(--line); cursor: not-allowed; }
  .btn86 { flex: 0 0 auto; font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: .16em;
           text-transform: uppercase; background: transparent; color: var(--neon); border: 1px solid var(--neon);
           border-radius: 999px; padding: 11px 13px; cursor: pointer; transition: all .2s ease; }
  .btn86:hover { background: var(--neon); color: var(--bg); }
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

// ---------- Data ----------
const CARD = 256, GAP = 12;
const U = 'https://images.unsplash.com/photo-';
const Q = '?fm=jpg&q=70&w=900&auto=format&fit=crop&ixlib=rb-4.1.0';

// ---------- State ----------
let state = initialState();
let timers = [];
let flashTimer = null;
let lastStep = 1;

function initialState() {
  return {
    theme: 'dark', device: 'phone', view: 'guest',
    tickets: SEED_TICKETS.map(t => ({ ...t })),
    eightySix: [],
    step: 1, guestOpener: '',
    order: [], justAdded: null,
    allergies: [], showSwaps: false, swaps: {},
    gi: 0,
    trackerStage: -1,
    resDate: 'sat', resTime: '9:45', party: 2, booked: false
  };
}

function setState(patch) {
  state = { ...state, ...(typeof patch === 'function' ? patch(state) : patch) };
  render();
}

function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function advanceTracker() {
  clearTimers();
  STAGES.forEach((s, i) => {
    timers.push(setTimeout(() => {
      setState({ trackerStage: i });
      if (i === STAGES.length - 1) timers.push(setTimeout(() => setState({ step: 7 }), 1400));
    }, 500 + i * 3200));
  });
}

// ---------- Actions ----------
const App = {
  toggleTheme: () => setState(s => ({ theme: s.theme === 'dark' ? 'light' : 'dark' })),
  toggleDevice: () => setState(s => ({ device: s.device === 'phone' ? 'tablet' : 'phone' })),
  toggleView: () => setState(s => ({ view: s.view === 'guest' ? 'kitchen' : 'guest' })),

  pickOpener: (label) => setState({ step: 2, guestOpener: label }),

  add: (id) => {
    if (state.eightySix.includes(id)) return;
    setState(s => ({
      order: s.order.includes(id) ? s.order : s.order.concat([id]),
      justAdded: id,
      step: Math.max(s.step, 3)
    }));
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => setState(s => ({ justAdded: null, step: Math.max(s.step, 4) })), 950);
  },

  goDot: (i) => setState({ gi: i }),

  toggleAllergy: (label) => setState(s => {
    const active = s.allergies.includes(label);
    return {
      allergies: label === 'Nothing tonight'
        ? (active ? [] : ['Nothing tonight'])
        : (active ? s.allergies.filter(a => a !== label) : s.allergies.filter(a => a !== 'Nothing tonight').concat([label]))
    };
  }),
  confirmAllergies: () => setState({ step: 5 }),

  warnAct: (i) => { const w = currentWarnings()[i]; if (w) w.act(); },
  approve: () => { setState({ step: 6, showSwaps: false }); advanceTracker(); },
  openSwaps: () => setState(s => ({ showSwaps: !s.showSwaps })),
  toggleSwap: (id) => setState(s => ({ swaps: { ...s.swaps, [id]: !s.swaps[id] } })),

  pickDate: (key) => setState({ resDate: key, booked: false }),
  pickTime: (key, open) => { if (open) setState({ resTime: key, booked: false }); },
  partyUp: () => setState(s => ({ party: Math.min(10, s.party + 1), booked: false })),
  partyDown: () => setState(s => ({ party: Math.max(1, s.party - 1), booked: false })),
  book: () => setState({ booked: true }),

  bump: (id) => {
    if (id === 'live') {
      clearTimers();
      const next = Math.min(3, state.trackerStage + 1);
      setState({ trackerStage: next });
      if (next === 3) timers = [setTimeout(() => setState({ step: 7 }), 1200)];
      return;
    }
    setState(s => ({ tickets: s.tickets.map(t => t.id === id ? { ...t, stage: Math.min(3, t.stage + 1) } : t) }));
  },

  eightySix: (dishId) => setState(s => ({
    eightySix: s.eightySix.includes(dishId) ? s.eightySix : s.eightySix.concat([dishId])
  })),

  restart: () => { clearTimers(); setState({ step: 1, order: [], allergies: [], showSwaps: false, swaps: {}, gi: 0, trackerStage: -1, booked: false, guestOpener: '', justAdded: null }); },

  // Gallery drag
  galDown: (e) => {
    const track = document.getElementById('galtrack');
    if (!track) return;
    const startX = e.clientX;
    let dx = 0;
    track.style.transition = 'none';
    const move = (ev) => {
      dx = ev.clientX - startX;
      track.style.transform = 'translateX(' + (-state.gi * (CARD + GAP) + dx) + 'px)';
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      let gi = state.gi;
      if (dx < -55) gi = Math.min(GALLERY.length - 1, gi + 1);
      else if (dx > 55) gi = Math.max(0, gi - 1);
      setState(s => ({ gi, step: Math.max(s.step, 4) }));
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  }
};

// ---------- Derived ----------
function totals() {
  const items = DISHES.filter(d => state.order.includes(d.id));
  const price = items.reduce((a, d) => a + d.price, 0);
  const swapDelta = SWAPS.reduce((a, s) => a + (state.swaps[s.id] ? s.delta : 0), 0);
  const cal = items.reduce((a, d) => a + d.cal, 0) + swapDelta;
  return { items, price, cal, swapDelta };
}

function currentWarnings() {
  const { items } = totals();
  const warnings = [];
  if (items.find(d => d.id === 'chicken')) warnings.push({
    kind: 'Out of stock · 11:38pm',
    text: 'That was the last chicken on the pass and booth 2 just took it. Chef can press a poussin instead, same lemon and thyme, five minutes quicker.',
    actLabel: 'Poussin is fine',
    act: () => setState(s => ({ order: s.order.filter(x => x !== 'chicken') }))
  });
  else if (items.find(d => d.id === 'frites')) warnings.push({
    kind: 'Out of stock · 11:38pm',
    text: 'The duck fat is down to one more basket tonight — yours is in it. After that, frites go to olive oil.',
    actLabel: 'Understood',
    act: () => setState({ showSwaps: false })
  });
  else if (items.length) warnings.push({
    kind: 'Out of stock · 11:38pm',
    text: 'Only two chickens left under the bricks tonight, if you were thinking about one.',
    actLabel: 'Add the chicken',
    act: () => App.add('chicken')
  });

  const flagged = items.filter(d => d.allergens.some(a => state.allergies.includes(a)));
  if (flagged.length) warnings.push({
    kind: 'Allergen flag · ' + state.allergies.filter(a => a !== 'Nothing tonight').join(', '),
    text: flagged.map(d => d.name).join(' and ') + (flagged.length > 1 ? ' contain' : ' contains')
      + ' what you asked me to keep away. The kitchen can rebuild ' + (flagged.length > 1 ? 'them' : 'it') + ', or I can swap the plate.',
    actLabel: 'Show me swaps',
    act: () => setState({ showSwaps: true })
  });
  return warnings;
}

const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function dishCardHTML(d) {
  const added = state.order.includes(d.id);
  const flash = state.justAdded === d.id;
  const gone = state.eightySix.includes(d.id);
  const showBadge = gone || d.low;
  const badgeLabel = gone ? '86 tonight' : '2 left';
  const btnClass = 'addbtn' + (gone ? ' gone' : added ? ' added' : '') + (flash ? ' flash' : '');
  const btnLabel = gone ? 'Off tonight' : added ? (flash ? 'Added ✓' : 'In your draft') : 'Add to order';
  return `
    <div class="dish">
      <div class="dish-img-wrap">
        <div class="dish-img" role="img" aria-label="${esc(d.name)}" style="background-image:url('${d.img}')"></div>

        ${showBadge ? `<div class="stockbadge">${badgeLabel}</div>` : ''}

          <button class="${btnClass}" data-act="add" data-arg="${d.id}">${btnLabel}</button>

    </div>`;
}

function ticketHTML(t) {

    + ';background:' + (t.stage === 1 ? 'var(--neon)' : 'transparent')

    + ';box-shadow:' + (t.stage === 1 ? 'var(--glow)' : t.stage === 3 ? 'var(--mintglow)' : 'none');
  const firstDish = DISHES.find(d => d.id === (t.items[0] || {}).dishId) || {};
  return `
  <div class="ticket${live ? ' live' : ''}${t.stage === 3 ? ' closed' : ''}">
    <div class="t-head">
      <div style="display:flex;flex-direction:column;gap:3px">
        <div class="t-seat">${esc(t.seat)}</div>
        ${live ? `<div class="t-live">Concierge · live</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="t-time">${esc(t.time)}</div>
        <div class="t-chip" style="${chipStyle}">${KSTAGES[t.stage]}</div>
      </div>
    </div>
    <div class="t-rows">
      ${t.items.map(r => `
        <div class="t-row">
          <div class="t-qty">${r.q}×</div>
          <div style="display:flex;flex-direction:column;gap:2px">
            <div class="t-name">${esc(r.name)}</div>
            ${r.mod ? `<div class="t-mod">${esc(r.mod)}</div>` : ''}
          </div>
        </div>`).join('')}
    </div>
    ${t.allergy ? `
      <div class="t-allergy">
        <div class="t-allergy-dot"></div>
        <div class="t-allergy-label">Allergy · ${esc(t.allergy)}</div>
      </div>` : ''}
    ${t.note ? `<div class="t-note">${esc(t.note)}</div>` : ''}
    <div class="t-actions">
      <button class="bumpbtn${t.stage === 3 ? ' closed' : ''}" data-act="bump" data-arg="${t.id}">
        ${t.stage === 3 ? 'Closed' : 'Bump to ' + KSTAGES[t.stage + 1]}
      </button>
      <button class="btn86" data-act="eightySix" data-arg="${firstDish.id || ''}">86 ${esc(firstDish.short || 'item')}</button>
    </div>
  </div>`;
}

function kitchenHTML() {
  const st = state;
  const { items } = totals();
  const liveTicket = st.step >= 6 ? {
    id: 'live', seat: 'Booth 4', time: '0:38',
    stage: Math.max(0, st.trackerStage),
    allergy: st.allergies.filter(a => a !== 'Nothing tonight').join(', '),
    note: SWAPS.filter(s => st.swaps[s.id]).map(s => s.label.toLowerCase()).join(' · '),
    items: items.map(d => ({ q: 1, name: d.name, dishId: d.id, mod: d.id === 'steak' ? 'rare' : '' }))
  } : null;
  const board = (liveTicket ? [liveTicket] : []).concat(st.tickets);
  const openCount = board.filter(t => t.stage < 3).length;
  const eightySixList = st.eightySix.map(id => (DISHES.find(d => d.id === id) || {}).name).join(' · ');

  return `
  <div class="frame-col">
    <div class="k-head">
      <div class="k-title-row">
        <div class="k-title">EXPO · THE LINE</div>
        <div class="k-open">${openCount} open</div>
      </div>
      <div class="k-stats">
        <div class="k-stat">18 covers seated</div>
        <div class="k-stat">Avg fire 9:12</div>
      </div>
      ${st.eightySix.length ? `
        <div class="k-86bar">
          <div class="k-86tag">86</div>
          <div class="k-86list">${esc(eightySixList)}</div>
        </div>` : ''}
    </div>
    <div class="k-scroll">
      <div class="k-grid">
        ${board.map(ticketHTML).join('')}
      </div>
    </div>
  </div>`;
}

// ---------- Root render ----------
function render() {
  const st = state;
  const scrollEl = document.getElementById('scroll');
  const prevScroll = scrollEl ? scrollEl.scrollTop : 0;

  document.getElementById('app').innerHTML = `
    <div data-theme="${st.theme}" data-device="${st.device}" style="display:contents">
      <div id="inner" style="min-height:100vh;background:var(--room);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 16px 56px;width:100%">
        <div class="topbar">
          <div>
            <div class="brand">MARGOT</div>
            <div class="brand-sub">Late bistro · booth 4</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="pillbtn neon" data-act="toggleView">${st.view === 'guest' ? 'Guest' : 'Kitchen'}</button>
            <button class="pillbtn" data-act="toggleTheme">${st.theme === 'dark' ? 'Night' : 'Daylight'}</button>
            <button class="pillbtn" data-act="toggleDevice">${st.device === 'phone' ? 'Phone' : 'Host stand'}</button>
          </div>
        </div>
        <div class="frame">
          ${st.view === 'guest' ? guestHTML() : kitchenHTML()}
        </div>
      </div>
    </div>`;

  const newScroll = document.getElementById('scroll');
  if (newScroll) {
    if (st.step > lastStep) newScroll.scrollTop = newScroll.scrollHeight;   // new content appeared below
    else newScroll.scrollTop = prevScroll;
  }
  lastStep = st.step;

  const gal = document.getElementById('galwrap');
  if (gal) gal.addEventListener('pointerdown', App.galDown);
}

// Delegated clicks
document.getElementById('app').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const arg = el.dataset.arg;
  switch (act) {
    case 'toggleTheme': App.toggleTheme(); break;
    case 'toggleDevice': App.toggleDevice(); break;
    case 'toggleView': App.toggleView(); break;
    case 'pickOpener': App.pickOpener(arg); break;
    case 'add': App.add(arg); break;
    case 'goDot': App.goDot(Number(arg)); break;
    case 'toggleAllergy': App.toggleAllergy(arg); break;
    case 'confirmAllergies': App.confirmAllergies(); break;
    case 'warnAct': App.warnAct(Number(arg)); break;
    case 'approve': App.approve(); break;
    case 'openSwaps': App.openSwaps(); break;
    case 'toggleSwap': App.toggleSwap(arg); break;
    case 'pickDate': App.pickDate(arg); break;
    case 'pickTime': App.pickTime(arg, el.dataset.open === 'true'); break;
    case 'partyUp': App.partyUp(); break;
    case 'partyDown': App.partyDown(); break;
    case 'book': App.book(); break;
    case 'bump': App.bump(arg); break;
    case 'eightySix': if (arg) App.eightySix(arg); break;
    case 'restart': App.restart(); break;
  }
});

render();
</script>
</body>
</html>
